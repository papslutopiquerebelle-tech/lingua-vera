<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingua Vera - Dictionnaire</title>
<style>
:root{--or:#c9a24b;--fond:#1b1510;--parch:#2a2118;--texte:#eadfc8}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font-family:Georgia,serif}
header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--or)}
h1{color:var(--or);margin:0;font-size:2.4rem;letter-spacing:.1em}
.sous{opacity:.8;margin-top:.5rem}
#google_translate_element{margin-top:1rem}
main{max-width:900px;margin:0 auto;padding:1rem}
#recherche{width:100%;padding:.8rem;font-size:1.1rem;background:var(--parch);color:var(--texte);border:1px solid var(--or);border-radius:6px;margin:1rem 0}
.entree{background:var(--parch);border-left:3px solid var(--or);padding:.7rem 1rem;margin:.5rem 0;border-radius:4px}
.lv{color:var(--or);font-size:1.3rem;font-weight:bold}
.cat{font-size:.8rem;opacity:.7;margin-left:.5rem}
.fr{margin-left:.5rem}
.def{display:block;opacity:.85;margin-top:.2rem}
#compteur{opacity:.7;font-size:.9rem}
</style>
</head>
<body>
<header>
<h1 class="notranslate" translate="no">LINGUA VERA</h1>
<div class="sous">Une langue universelle née de cinq familles linguistiques</div>
<div id="google_translate_element"></div>
</header>
<main>
<input id="recherche" type="search" placeholder="Rechercher un mot...">
<div id="compteur"></div>
<div id="liste"></div>
</main>
<script>
function googleTranslateElementInit(){
  new google.translate.TranslateElement({pageLanguage:'fr',autoDisplay:false},'google_translate_element');
}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
let dico=[];
function afficher(filtre){
  const f=(filtre||'').toLowerCase();
  const liste=document.getElementById('liste');
  liste.innerHTML='';
  const res=dico.filter(e=>(e.francais+' '+e.lingua_vera+' '+e.definition).toLowerCase().includes(f));
  res.forEach(e=>{
    const d=document.createElement('div');d.className='entree';
    const lv=document.createElement('span');
    lv.className='lv notranslate';lv.setAttribute('translate','no');lv.textContent=e.lingua_vera;
    const cat=document.createElement('span');cat.className='cat';cat.textContent=e.categorie;
    const fr=document.createElement('span');fr.className='fr';fr.textContent='= '+e.francais;
    const def=document.createElement('span');def.className='def';def.textContent=e.definition;
    d.append(lv,cat,fr,def);liste.appendChild(d);
  });
  document.getElementById('compteur').textContent=res.length+' mot(s)';
}
fetch('dictionnaire.json').then(r=>r.json()).then(j=>{
  dico=j.sort((a,b)=>a.francais.localeCompare(b.francais,'fr'));
  afficher('');
});
document.getElementById('recherche').addEventListener('input',e=>afficher(e.target.value));
</script>
</body>
</html>
